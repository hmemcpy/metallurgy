# ide-probe config for the Metallurgy NamedTypeArgs highlight test.
# Adjust paths/versions to the local environment before running `sbt test` in this module.
probe {
  ide {
    version = "261.26222.65"
    edition = "IC"
    plugins = [
      { id = "com.hmemcpy.metallurgy", path = "../target/plugin/metallurgy" }
    ]
  }
  workspace {
    path = "../../metallurgy-dogfood"
  }
}
