probe {
  intellij {
    version {
      build = "261.26222.65"
      release = "2026.1.4"
      ext = ".zip"
    }
    plugins = [
      { uri = "file://"${METALLURGY_REPO_ROOT}"/ideprobe-tests/target/scala-plugin.zip" },
      { uri = "file://"${METALLURGY_REPO_ROOT}"/ideprobe-tests/target/metallurgy.zip" },
      { uri = "file://"${METALLURGY_REPO_ROOT}"/ideprobe-tests/target/ideprobe-261.zip" }
    ]
  }
  workspace {
    path = "file://"${METALLURGY_REPO_ROOT}"/dogfood"
  }
  resolvers {
    intellij.repositories = [
      "file://"${METALLURGY_INTELLIJ_HOME}
    ]
    retries = 0
  }
  driver {
    launch.timeout = "2.minutes"
    display = "xvfb"
    check {
      errors {
        enabled = true
        includeMessages = [".*"]
        excludeMessages = []
      }
      freezes.enabled = true
    }
    vmOptions = [
      "-Xms128m",
      "-Xmx900m",
      "-XX:ReservedCodeCacheSize=192m",
      "-Didea.is.integration.test=true",
      "-Dintellij.startup.wizard=false",
      "-Dide.newUsersOnboarding=false",
      "-Dide.integration.test.disable.got.it.tooltips=true",
      "-Dide.show.tips.on.startup.default.value=false",
      "-Didea.fatal.error.notification=true",
      "-Djb.privacy.policy.ai.assistant.text=<!--999.999-->",
      "-Dmarketplace.eula.reviewed.and.accepted=true",
      "-Dwriterside.eula.reviewed.and.accepted=true"
    ]
  }
  paths {
    base = ${METALLURGY_REPO_ROOT}"/ideprobe-tests/target/ideprobe-runtime"
    trusted = ${METALLURGY_REPO_ROOT}"/ideprobe-tests/target/ideprobe-runtime/workspaces"
    logExport = ${METALLURGY_REPO_ROOT}"/ideprobe-tests/target/ideprobe-artifacts/idea-logs"
  }
}
