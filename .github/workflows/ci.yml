name: CI

on:
  push:
    branches: [ idea*.x ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup bootstrap Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          java-package: jdk
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Verify baseline and resolve pinned IntelliJ SDK
        run: |
          java scripts/MetallurgyBaselineVerifier.java static
          intellij_build="$(java scripts/MetallurgyBaselineVerifier.java value intellij.build)"
          echo "METALLURGY_INTELLIJ_HOME=$HOME/.metallurgyPluginIC/sdk/$intellij_build" >> "$GITHUB_ENV"
          timeout --kill-after=5s 120s sbt -batch -no-colors updateIntellij

      - name: Switch to verified IntelliJ JBR
        run: |
          if [[ -x "$METALLURGY_INTELLIJ_HOME/jbr/Contents/Home/bin/java" ]]; then
            jbr="$METALLURGY_INTELLIJ_HOME/jbr/Contents/Home"
          else
            jbr="$METALLURGY_INTELLIJ_HOME/jbr"
          fi
          "$jbr/bin/java" scripts/MetallurgyBaselineVerifier.java host "$METALLURGY_INTELLIJ_HOME"
          echo "JAVA_HOME=$jbr" >> "$GITHUB_ENV"
          echo "$jbr/bin" >> "$GITHUB_PATH"

      - name: Check formatting and compile
        run: timeout --kill-after=5s 120s sbt -batch -no-colors scalafmtCheckAll compile 'Test/compile'

      - name: Fetch pinned IntelliJ Scala revision
        run: |
          git init target/intellij-scala-origin
          git -C target/intellij-scala-origin remote add origin https://github.com/JetBrains/intellij-scala.git
          timeout --kill-after=5s 120s git -C target/intellij-scala-origin fetch --depth=1 origin 8dd22d153b65c847f4ced8917dd7e02b83561e5d

      - name: Verify copied IntelliJ tests
        run: |
          timeout --kill-after=5s 120s sbt -batch -no-colors \
            -Dintellij.scala.repo=target/intellij-scala-origin \
            verifyCopiedIntellijTestsAgainstOrigin
          timeout --kill-after=5s 120s sbt -batch -no-colors verifyCopiedIntellijTests

      - name: Verify deterministic test planning
        run: scripts/test-test-lane-runner.sh

      - name: Run representative deterministic lane
        env:
          METALLURGY_TEST_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: scripts/run-test-lane.sh test-lanes/ci.txt

      - name: Upload retained test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metallurgy-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/test-evidence
          if-no-files-found: error
