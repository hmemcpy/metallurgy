name: CI

on:
  push:
    branches: [ idea*.x ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JetBrains Runtime 25
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: '25'
          java-package: jdk
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Check formatting and compile
        run: timeout --kill-after=5s 120s sbt -batch -no-colors scalafmtCheckAll compile

      - name: Verify deterministic test planning
        run: scripts/test-test-lane-runner.sh

      - name: Run representative deterministic lane
        env:
          METALLURGY_TEST_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: scripts/run-test-lane.sh test-lanes/ci.txt

      - name: Upload retained test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metallurgy-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/test-evidence
          if-no-files-found: error
